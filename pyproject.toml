[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dem-md"                       
version = "0.1.0"
description = "Dynamic Expectation-Maximization algorithms for Mixed-type Data"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Solange Pruilh", email = "pruilhsolange@gmail.com" },
]
keywords = ["mixture model", "EM algorithm", "clustering", "mixed-type data"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.4",
    "pandas>=2.2",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Paper = "https://hal.science/hal-04510689"


[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
